    <!-- The curtain: two pink gateway doors with a marigold medallion, drawn here so it is on screen
         with the first bytes, before any script or stylesheet. Its petals light up as the opening
         scene's artwork arrives (--p, 0 to 1), and the doors swing open once the scene is whole
         (src/components/Curtain.tsx). -->
    <style>
      html.curtained {
        overflow: hidden;
      }
      #curtain {
        position: fixed;
        inset: 0;
        z-index: 1000;
        touch-action: none;
        animation: curtain-give-up 0.6s 30s forwards;
      }
      .curtain-door {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background:
          radial-gradient(circle, rgb(255 184 28 / 0.3) 1.5px, transparent 2.2px) 0 0 / 24px 24px,
          linear-gradient(#f5288d, #ce0e71);
        transition: transform 1.1s cubic-bezier(0.7, 0, 0.25, 1) 0.15s;
      }
      .curtain-door::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 24px;
        background:
          radial-gradient(circle at 0 0, #0f9a91 0 5px, #2a0718 5.5px 7px, transparent 7.5px) 0 0 / 28px 24px repeat-x,
          radial-gradient(circle at 50% 0, #ffb81c 0 9px, #2a0718 9.5px 11.5px, transparent 12px) 0 0 / 28px 24px repeat-x;
      }
      .curtain-door::before {
        content: '';
        position: absolute;
        inset: 36px 0 18px 18px;
        border: 2px solid rgb(255 184 28 / 0.6);
        border-right: 0;
        border-radius: 100% 0 0 0 / 22% 0 0 0;
      }
      .curtain-door-l {
        left: 0;
        box-shadow:
          inset -6px 0 0 #ffb81c,
          inset -9px 0 0 #2a0718;
      }
      .curtain-door-r {
        right: 0;
        box-shadow:
          inset 6px 0 0 #ffb81c,
          inset 9px 0 0 #2a0718;
      }
      .curtain-door-r::before {
        inset: 36px 18px 18px 0;
        transform: scaleX(-1);
      }
      .curtain-centre {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
        transform: translate(-50%, -50%);
        transition:
          transform 0.6s ease,
          opacity 0.45s ease;
      }
      .curtain-bloom {
        width: min(54vw, 30vh, 240px);
        height: auto;
        filter: drop-shadow(0 6px 0 rgb(42 7 24 / 0.35));
        animation: curtain-breathe 2.4s ease-in-out infinite alternate;
      }
      .curtain-scallops {
        animation: curtain-turn 24s linear infinite;
      }
      .curtain-petals use {
        opacity: calc(0.2 + 0.8 * clamp(0, var(--p, 0) * 12 - var(--i), 1));
        transition: opacity 0.35s ease;
      }
      .curtain-names {
        margin: 0;
        padding: 0.5rem 1.1rem 0.45rem;
        border-radius: 999px;
        background: #2a0718;
        color: #fff1d6;
        font: 600 0.82rem/1 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .curtain-names span {
        color: #ffb81c;
      }
      #curtain.open {
        pointer-events: none;
      }
      #curtain.open .curtain-centre {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0;
      }
      #curtain.open .curtain-door-l {
        transform: translateX(-101%);
      }
      #curtain.open .curtain-door-r {
        transform: translateX(101%);
      }
      @keyframes curtain-turn {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes curtain-breathe {
        to {
          transform: scale(1.035);
        }
      }
      @keyframes curtain-give-up {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #curtain {
          transition: opacity 0.4s ease;
        }
        #curtain.open {
          opacity: 0;
        }
        #curtain.open .curtain-door-l,
        #curtain.open .curtain-door-r {
          transform: none;
        }
        .curtain-bloom,
        .curtain-scallops {
          animation: none;
        }
      }
    </style>
    <noscript>
      <style>
        html.curtained {
          overflow: auto;
        }
        #curtain {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>

          </g>

  </body>
