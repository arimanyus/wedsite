name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # While the repository's Pages source is still "Deploy from a branch", GitHub also publishes the
  # raw source files on every push, which leaves the page blank. Deploying again once that finishes
  # puts the built site back. This trigger does nothing once the source is "GitHub Actions".
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
